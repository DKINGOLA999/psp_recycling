<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar navbar-expand bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/">Sigma Recycling</a>
    <div class="ms-auto">
      <a href="admin_users.html" class="btn btn-outline-secondary btn-sm me-2">Users</a>
      <a href="admin_pickups.html" class="btn btn-outline-primary btn-sm me-2">Pickups</a>
      <a href="admin_payments.html" class="btn btn-outline-success btn-sm me-2">Payments</a>
      <a href="/api/public/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>

  <main class="container py-4">
    <h3 class="fw-bold">Users (Admin)</h3>
    <div id="users">Loading...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/adminAuth.js"></script>
  <script>
    (async function(){
      try{
        const res = await apiFetch('/admin/users');
        const users = res.users || [];
        const html = users.map(u => `
          <div class="d-flex align-items-center justify-content-between payment">
            <div><strong>${u.name}</strong><div class="muted">${u.email}</div></div>
            <div>
              <button data-id="${u._id}" class="btn btn-sm btn-outline-danger del">Delete</button>
            </div>
          </div>
        `).join('\n');
        document.getElementById('users').innerHTML = html;
        document.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async e =>{
          const id = e.target.dataset.id;
          if(!confirm('Delete this user?')) return;
          await fetch('/api/admin/users/' + id, { method: 'DELETE', credentials: 'include' });
          location.reload();
        }));
      } catch(e){ document.getElementById('users').textContent = 'Error loading users' }
    })();
  </script>
  <script src="scripts/footer.js"></script>
</body>
</html>
