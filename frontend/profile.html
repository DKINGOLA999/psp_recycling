<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile - PSP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container form-card">
    <div class="card shadow-sm p-4">
      <h3 class="fw-bold mb-3">Your Profile</h3>
      <div class="hero-image mb-3" style="background-image:url('images/hero-1.jpg')"></div>
      <div id="profile" class="mb-3">Loading...</div>

      <h5 class="mt-3">Edit Profile</h5>
      <form id="editForm">
        <input name="name" class="form-control mb-2" placeholder="Name">
        <input name="email" type="email" class="form-control mb-2" placeholder="Email">
        <input name="password" type="password" class="form-control mb-3" placeholder="Password (leave blank to keep)">
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
      <p id="msg" class="mt-3 muted"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/profile.js"></script>
  <script src="scripts/footer.js"></script>
</body>
</html>
