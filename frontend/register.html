<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - PSP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container form-card">
    <div class="card shadow-sm p-4">
      <div class="hero-image mb-3" style="background-image:url('images/hero-2.jpg')"></div>
      <h3 class="fw-bold mb-3">Create an Account</h3>
      <form id="registerForm">
        <input name="name" class="form-control mb-2" placeholder="Full name" required>
        <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
        <input name="password" type="password" class="form-control mb-2" placeholder="Password (min 6)" required>
        <input name="houseNumber" class="form-control mb-2" placeholder="House Number" required>
        <input name="street" class="form-control mb-2" placeholder="Street" required>
        <input name="state" class="form-control mb-2" placeholder="State" required>
        <input name="country" class="form-control mb-3" placeholder="Country" required>
        <select name="userType" class="form-select mb-3" required>
          <option value="">Select account type</option>
          <option value="household">Household</option>
          <option value="company">Company</option>
        </select>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p id="msg" class="mt-3 muted"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/register.js"></script>
  <script src="scripts/footer.js"></script>
</body>
</html>
