<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - PSP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container form-card">
    <div class="card shadow-sm p-4">
      <div class="hero-image mb-3" style="background-image:url('images/hero-2.jpg')"></div>
      <h3 class="fw-bold mb-3">Create an Account</h3>
      <form id="registerForm">
        <input name="name" class="form-control mb-2" placeholder="Full name" required>
        <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
        <input name="password" type="password" class="form-control mb-2" placeholder="Password (min 6)" required>
        <input name="houseNumber" class="form-control mb-2" placeholder="House Number" required>
        <input name="street" class="form-control mb-2" placeholder="Street" required>
        <input name="state" class="form-control mb-2" placeholder="State" required>
        <input name="country" class="form-control mb-3" placeholder="Country" required>
        <select name="userType" class="form-select mb-3" required>
          <option value="">Select account type</option>
          <option value="household">Household</option>
          <option value="company">Company</option>
        </select>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p id="msg" class="mt-3 muted"></p>
    </div>
  </div>

  <!-- Email Verification Modal -->
  <div class="modal fade" id="verificationModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold text-center w-100">Verify Your Email</h5>
        </div>
        <div class="modal-body px-4 pb-4">
          <p class="text-muted text-center mb-4">We've sent a 4-digit verification code to your email. Please enter it below.</p>
          
          <!-- 4-Digit Input Boxes -->
          <div class="d-flex justify-content-center gap-3 mb-4">
            <input type="text" maxlength="1" class="form-control text-center verification-input" 
                   style="width: 60px; height: 60px; font-size: 28px; font-weight: bold; border: 2px solid #dee2e6; border-radius: 8px;" 
                   id="digit1" data-index="0" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="form-control text-center verification-input" 
                   style="width: 60px; height: 60px; font-size: 28px; font-weight: bold; border: 2px solid #dee2e6; border-radius: 8px;" 
                   id="digit2" data-index="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="form-control text-center verification-input" 
                   style="width: 60px; height: 60px; font-size: 28px; font-weight: bold; border: 2px solid #dee2e6; border-radius: 8px;" 
                   id="digit3" data-index="2" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="form-control text-center verification-input" 
                   style="width: 60px; height: 60px; font-size: 28px; font-weight: bold; border: 2px solid #dee2e6; border-radius: 8px;" 
                   id="digit4" data-index="3" inputmode="numeric" pattern="[0-9]">
          </div>
          
          <p id="verifyMsg" class="text-center mb-3"></p>
          
          <button id="verifyBtn" class="btn btn-primary w-100 mb-2">Verify Email</button>
          <button id="resendBtn" class="btn btn-outline-secondary w-100">Resend Code</button>
          
          <p class="text-muted text-center small mt-3 mb-0">Code expires in 10 minutes</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/register.js"></script>
  <script src="scripts/footer.js"></script>
</body>
</html>
