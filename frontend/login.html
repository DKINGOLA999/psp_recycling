<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PSP Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container form-card">
    <div class="card shadow-sm p-4">
      <div class="hero-image mb-3" style="background-image:url('images/hero-3.jpg')"></div>
      <h4 class="text-center fw-bold mb-3">Sign In</h4>

      <form id="loginForm">
        <input name="email" id="email" class="form-control mb-2" placeholder="Email Address" required>
        <input name="password" id="password" type="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>

      <p id="msg" class="text-center mt-2 muted"></p>

      <p class="text-center mt-3 muted">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/login.js"></script>
  <script src="scripts/footer.js"></script>
</body>
</html>
