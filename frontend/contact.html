<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Sigma Recycling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary fs-4" href="/">Sigma Recycling</a>
    <div class="ms-auto">
      <a href="login.html" class="btn btn-outline-primary btn-sm me-2">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <section class="form-card">
    <div class="card">
      <div class="hero"></div>
      <div class="card-body">
        <h3 class="fw-bold">Contact Support</h3>
        <p class="muted">Have an issue or question? Send us a message and we'll get back to you within 24–48 hours.</p>

        <div id="msg" class="text-success mb-2"></div>

        <form id="contactForm" class="mt-3">
          <div class="mb-3">
            <label class="form-label">Name (optional if logged in)</label>
            <input id="name" class="form-control" placeholder="Your full name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email (optional if logged in)</label>
            <input id="email" type="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input id="subject" class="form-control" placeholder="Short summary of the issue">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea id="message" rows="6" class="form-control" placeholder="Describe the problem or request in detail..."></textarea>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Send Message</button>
            <a href="dashboard.html" class="btn btn-outline-white">Back to Dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/api.js"></script>
<script src="scripts/contact.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
