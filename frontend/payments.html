<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Payments - PSP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4">
    <div class="hero-image mb-3" style="background-image:url('images/hero-3.jpg')"></div>
    <h3 class="fw-bold">Your Payments</h3>
    <div id="list">Loading...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/api.js"></script>
  <script>
    (async function(){
      try{
        const res = await apiFetch('/payments/my-payment');
        if(!res || !res.payments) { document.getElementById('list').textContent = 'No payments'; return }
        const html = res.payments.map(p => `<div class="payment"><div class="d-flex justify-content-between"><div><strong>${p.monthPaidFor}</strong><div class="muted">${p.name || ''} • ${p.email || ''}</div></div><div class="text-end">${p.status ? `<span class=\"badge bg-secondary\">${p.status}</span>` : ''}<div class=\"mt-1 fw-bold\">${p.amountPaid}</div></div></div><div class=\"mt-2 muted\">Outstanding before: ${p.outstandingBefore}</div></div>`).join('\n');
        document.getElementById('list').innerHTML = html;
      } catch(e){ document.getElementById('list').textContent = 'Error loading payments' }
    })();
  </script>
    <script src="scripts/footer.js"></script>
</body>
</html>
