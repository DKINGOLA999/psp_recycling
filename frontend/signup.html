<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5" style="max-width:420px">
  <div class="card shadow-sm p-4">
    <h4 class="text-center fw-bold mb-3">Create Account</h4>

    <input id="name" class="form-control mb-2" placeholder="Name / Company Name">
    <input id="email" class="form-control mb-2" placeholder="Email Address">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">
    <input id="account" class="form-control mb-2" placeholder="Account Number">
    <input id="houseNumber" class="form-control mb-2" placeholder="House Number">
    <input id="street" class="form-control mb-2" placeholder="Street">
    <input id="country" class="form-control mb-2" placeholder="Country">

    <select id="userType" class="form-select mb-3">
        <option value="">Register As</option>
        <option value="company">Company</option>
        <option value="household">Household</option>
    </select>

    <button onclick="signup()" class="btn btn-primary w-100">Create Account</button>
    <p class="text-center mt-3"><a href="login.html">Already have an account?</a></p>
  </div>
</div>



<script src="signup.js">
    async function signup() {
  const res = await fetch('http://localhost:4000/api/users/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      password: password.value,
      account: account.value,
      role: 'user',
      houseNumber: houseNumber.value,
      street: street.value,
      country: country.value,
      userType: userType.value
    })
  });

  const data = await res.json();
  alert(data.message || data.error);
}

</script>

<script src="scripts/footer.js"></script>

</body>
</html>
